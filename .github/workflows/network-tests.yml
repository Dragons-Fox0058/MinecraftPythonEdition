name: Protocol 340 network tests

on:
  push:
    branches: [main]
    paths:
      - "engine/network/**"
      - "tests/test_network*.py"
      - ".github/workflows/network-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/network/**"
      - "tests/test_network*.py"
      - ".github/workflows/network-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install network test dependencies
        run: python -m pip install --upgrade pip numpy cryptography
      - name: Run protocol 340 tests
        run: python -m unittest discover -s tests -p "test_network*.py" -v
