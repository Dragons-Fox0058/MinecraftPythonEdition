name: Native C++ 26.3 CI

on:
  push:
    branches: [native-cpp-26.3]
    paths:
      - "native-cpp/**"
      - ".github/workflows/native-cpp-26.3.yml"
  pull_request:
    branches: [native-cpp-26.3]
    paths:
      - "native-cpp/**"
      - ".github/workflows/native-cpp-26.3.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S native-cpp -B native-cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S native-cpp -B native-cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native-cpp/build --config Release --parallel
      - name: Test
        run: ctest --test-dir native-cpp/build -C Release --output-on-failure
