name: Real Minecraft Java 1.12.2 interoperability

on:
  workflow_dispatch:

jobs:
  java-1-12-2:
    # The repository owner must first review and explicitly accept the Minecraft EULA
    # by setting the repository Actions variable MINECRAFT_EULA_ACCEPTED=true.
    if: ${{ vars.MINECRAFT_EULA_ACCEPTED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        run: python -m pip install numpy
      - name: Download and verify official 1.12.2 server
        run: |
          curl --fail --location --retry 3 \
            https://piston-data.mojang.com/v1/objects/886945bfb2b978778c3a0288fd7fab09d315b25f/server.jar \
            --output server.jar
          echo "886945bfb2b978778c3a0288fd7fab09d315b25f  server.jar" | sha1sum --check
      - name: Configure offline test server
        run: |
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          server-ip=127.0.0.1
          server-port=25565
          online-mode=false
          max-players=2
          view-distance=2
          level-type=flat
          generate-structures=false
          spawn-protection=0
          max-tick-time=-1
          motd=MinecraftPythonEdition protocol test
          EOF
      - name: Start real Java server
        run: |
          java -Xms512M -Xmx1024M -jar server.jar nogui > server.log 2>&1 &
          echo $! > server.pid
      - name: Test status and offline login
        run: python tools/test_java_1_12_2_server.py
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
            for i in $(seq 1 20); do
              kill -0 "$(cat server.pid)" 2>/dev/null || break
              sleep 1
            done
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.12.2-server-log
          path: server.log
