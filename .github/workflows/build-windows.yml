name: Windows launcher build

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher.py"
      - "engine/app/**"
      - "engine/render/**"
      - "engine/network/**"
      - "engine/server/**"
      - "requirements.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build launcher EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MinecraftPythonLauncher --collect-all glfw --collect-all OpenGL launcher.py
      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftPythonLauncher-windows-x64
          path: dist/MinecraftPythonLauncher.exe
          if-no-files-found: error
